name: Amber Battery AI
description: AI-powered wholesale electricity arbitrage optimizer for Sigenstor and Amber Express
version: "1.0.8"
slug: amber_battery_ai
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-high
panel_title: Battery AI
options:
  ai_provider_endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
  ai_api_key: ""
  ai_model: "gemini-3.5-flash-lite"
  battery_soc_entity: "sensor.la_electrical_battery_soc"
  battery_power_entity: "sensor.la_electrical_battery_power"
  home_power_entity: "sensor.la_sigenstor1_home_power"
  grid_status_entity: "sensor.la_sigenstor_1_grid_status"
  battery_capacity_kwh: 16.0
  general_price_entity: "sensor.amber_express_home_general_price"
  feed_in_price_entity: "sensor.amber_express_home_feed_in_price"
  weather_entity: "weather.welby_hourly"
  solar_forecast_entity: "sensor.solcast_pv_forecast_forecast_today"
  solar_forecast_remaining_entity: "sensor.solcast_pv_forecast_forecast_remaining_today"
  interval_minutes: 30
  forecast_hours: 12
  min_export_price: 0.15
  max_export_price: 5.00
  min_export_stop_soc: 20
  max_export_stop_soc: 95
  min_import_price: -1.00
  max_import_price: 0.25
  min_import_stop_soc: 30
  max_import_stop_soc: 100
  max_power_watts: 10000
schema:
  ai_provider_endpoint: str
  ai_api_key: password
  ai_model: str
  battery_soc_entity: str
  battery_power_entity: str
  home_power_entity: str
  grid_status_entity: str
  battery_capacity_kwh: float
  general_price_entity: str
  feed_in_price_entity: str
  weather_entity: str
  solar_forecast_entity: str
  solar_forecast_remaining_entity: str
  interval_minutes: int(5,120)
  forecast_hours: int(4,24)
  min_export_price: float
  max_export_price: float
  min_export_stop_soc: int(10,100)
  max_export_stop_soc: int(10,100)
  min_import_price: float
  max_import_price: float
  min_import_stop_soc: int(10,100)
  max_import_stop_soc: int(10,100)
  max_power_watts: int(1000,30000)
